{% extends 'base.html' %}
{% block content %}

<div class="pageholder">
    <div class="titleholder"> 
        
        <div class="title"> Geocoding template for {{location.name}} ({{label}})</div> 
        
    </div>


    <div class="linkholder">
            <table id="ourtable3" class="myTable m-3">
                <thead>
                    <tr>
                        <th>livreur</th>
                        <th>distance</th>
                        <th>duration</th>
                                              
                    </tr>
                </thead>

                <tbody>
                    
                    {%for key,value in distances.items %}
                    <tr>
                        <td> {{ key }}</td>
                        {%for a in value %}
                        <td> {{ a }} </td>
                        {%endfor%}
                       
                    </tr>
                    {%endfor%}
                </tbody>

                
            </table>
     </div>

    

</div>

{% endblock %}
